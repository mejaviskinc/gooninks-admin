name: Deploy GoO Ninks Admin to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Validate static dashboard
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html admin.js admin.css admin-plus.js admin-plus.css admin-reports.js admin-reports.css gn-config.js brand-loader.css brand-loader.js favicon.svg logo-gooninks.svg gooninks-admin-logo.png CNAME; do
            test -s "$f" || { echo "Missing: $f"; exit 1; }
          done
          grep -q 'admin.gooninks.co.id' CNAME
          grep -q 'PRIVATE WORKSPACE' index.html
          node --check admin.js
          node --check admin-plus.js
          node --check admin-reports.js
          grep -q 'admin-plus.js' index.html
          grep -q 'admin-reports.js' index.html
          grep -q 'admin-reports.css' index.html
          if grep -Ein '(sb_secret_|service_role)' gn-config.js index.html admin.js admin-plus.js admin-reports.js; then
            echo 'Potential server-side secret in public assets'; exit 1
          fi
      - name: Stage public files only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html admin.js admin.css admin-plus.js admin-plus.css admin-reports.js admin-reports.css gn-config.js brand-loader.css brand-loader.js favicon.svg logo-gooninks.svg gooninks-admin-logo.png CNAME robots.txt .nojekyll _site/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-domain:
    name: Check custom domain after publish
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Inspect DNS and HTTPS (non-blocking)
        shell: bash
        run: |
          set -u
          echo 'CNAME record:'
          dig +short CNAME admin.gooninks.co.id || true
          echo 'A records:'
          dig +short A admin.gooninks.co.id || true
          echo 'HTTPS check:'
          if curl --silent --show-error --location --head --connect-timeout 6 --max-time 15 --output /dev/null --write-out 'HTTP %{http_code}\n' https://admin.gooninks.co.id/; then
            echo 'HTTPS endpoint responded'
          else
            echo '::warning::HTTPS endpoint is not reachable yet; verify GitHub Pages custom domain, DNS, and certificate'
          fi
